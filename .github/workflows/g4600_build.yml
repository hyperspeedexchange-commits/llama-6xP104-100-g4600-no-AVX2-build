name: Build llama.cpp for P104-100

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          
      - name: Clone llama.cpp
        run: git clone https://github.com/ggerganov/llama.cpp.git
        
      - name: Download CUDA
        run: |
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/12.4.0/local_installers/cuda_12.4.0_551.61_windows.exe" -OutFile "cuda_installer.exe"
          
      - name: Install CUDA
        run: |
          Start-Process -FilePath "cuda_installer.exe" -ArgumentList "-s nvcc_12.4 cudart_12.4" -Wait
        
      - name: Build
        run: |
          $env:PATH = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin;" + $env:PATH
          cd llama.cpp
          mkdir build
          cd build
          cmake .. -DLLAMA_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=61 -DLLAMA_AVX2=OFF -DLLAMA_AVX=OFF -DLLAMA_FMA=OFF -DLLAMA_F16C=OFF -DCMAKE_CUDA_COMPILER="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.4/bin/nvcc.exe"
          cmake --build . --config Release -j4
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-p104-100
          path: llama.cpp/build/bin/Release/
