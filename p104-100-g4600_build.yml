name: Build llama.cpp for P104-100

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.14
        with:
          cuda: '12.4.0'
          
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          
      - name: Clone llama.cpp
        run: git clone https://github.com/ggerganov/llama.cpp.git
        
      - name: Build
        run: |
          cd llama.cpp
          mkdir build
          cd build
          cmake .. -DLLAMA_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=61 -DLLAMA_AVX2=OFF -DLLAMA_AVX=OFF -DLLAMA_FMA=OFF -DLLAMA_F16C=OFF
          cmake --build . --config Release -j4
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-p104-100
          path: llama.cpp/build/bin/Release/
